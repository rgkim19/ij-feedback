/* 올려둔 파일을 고치면, 열어두신 창이 옛 내용을 계속 보여주지 않도록 한 번만 새로 받는다 */
(function () {
  var V = "1793984200";
  fetch("version.txt?t=" + Date.now(),
         { cache: "no-store", headers: { "Cache-Control": "no-cache" } })
    .then(function (r) { return r.ok ? r.text() : ""; })
    .then(function (t) {
      t = (t || "").trim();
      if (!t || t === V) return;
      if (location.search.indexOf("v=" + t) >= 0) return;   // 이미 새 판
      location.replace(location.pathname + "?v=" + t + location.hash);
    })
    .catch(function () {});
})();
</script>
